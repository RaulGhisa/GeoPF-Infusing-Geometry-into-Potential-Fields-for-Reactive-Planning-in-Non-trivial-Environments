# Example GeoPF tuning parameters. Combine with a scene file:
#   ./build/geopf -c examples/scene.yaml -c examples/params.yaml
# Every key is optional; the values below are the defaults.

# Force gains
k_attr: 1.0        # pull towards the goal
k_boundary: 0.1    # workspace boundary
k_circ: 0.1        # spheres
k_line: 0.1        # line segments
k_plane: 0.1       # rectangular planes
k_cubic: 0.1       # boxes
k_cylinder: 0.1    # cylinders

# Integration
dt: 0.01               # time step
v_max: 0.04            # speed limit
mass: 1.0              # point mass
goal_tolerance: 0.01   # stop when this close to the goal
max_iter: 100000       # give up after this many steps (also read as limit_iter)
sphere_rad: 0.01       # radius for spheres given as a bare [x, y, z]
